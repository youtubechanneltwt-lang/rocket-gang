<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Space Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">

        <div id="startScreen" class="screen">
            <h1>🚀 ROCKET</h1>
            <p>SPACE ADVENTURE</p>
            <button id="startBtn">▶ START GAME</button>
            <button id="helpBtn">ℹ HOW TO PLAY</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="hud">
            <div>❤️ Lives: <span id="lives">3</span></div>
            <div>🏆 Score: <span id="score">0</span></div>
            <div>⭐ Best: <span id="highScore">0</span></div>
        </div>

        <button id="pauseBtn" class="pause">Ⅱ</button>

        <div id="mobileControls">
            <div>
                <button data-key="ArrowUp">▲</button>
            </div>
            <div>
                <button data-key="ArrowLeft">◀</button>
                <button data-key="ArrowDown">▼</button>
                <button data-key="ArrowRight">▶</button>
            </div>
            <button data-key="Space" class="boost">🚀 BOOST</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h1>💥 GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">🔄 PLAY AGAIN</button>
            <button id="menuBtn">🏠 MAIN MENU</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
